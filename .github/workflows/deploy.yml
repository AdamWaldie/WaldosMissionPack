name: Deploy
on:
  release:
      # `published` is emitted for both stable releases and prereleases. Listening to
      # `prereleased` as well starts this workflow twice for one published prerelease.
      types: [published]
jobs:
  build:
    name: Create And Upload Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow (cover image generator)
        run: pip install Pillow
      - name: Install PyYAML (Claude skill validator)
        run: pip install pyyaml

      - name: Prepare Deploy
        run: chmod +x ./releaseVerificationAndDeployment/deploy.sh

      - name: Build release
        run: ./releaseVerificationAndDeployment/deploy.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Upload Release WMP
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/WMP-${{ steps.get_version.outputs.VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release WMP (Patch)
        continue-on-error: true
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/WMP_Patch_v* application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release WMP (Compositions)
        continue-on-error: true
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/WMP_Compositions-${{ steps.get_version.outputs.VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release WMP Unit Insignias
        continue-on-error: true
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/WMP_Unit_Insignias-${{ steps.get_version.outputs.VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      
      - name: Upload Release WMP Exemplar Mission
        continue-on-error: true
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/WMP_Exemplar_Mission-${{ steps.get_version.outputs.VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Claude Mission Config Skill
        continue-on-error: true
        uses: JasonEtco/upload-to-release@master
        with:
          args: release/mission-pack-config-${{ steps.get_version.outputs.VERSION }}.zip application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-main-version:
    name: Sync main branch version and cover image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow (cover image generator)
        run: pip install Pillow
      - name: Bump description.ext to the release version
        run: python3 releaseVerificationAndDeployment/set_description_version.py "${{ steps.get_version.outputs.VERSION }}"
      - name: Regenerate cover image from description.ext
        run: python3 releaseVerificationAndDeployment/generateLoadingScreen.py
      - name: Commit and push if either file changed
        run: |
          if git diff --quiet -- description.ext Pictures/loading.jpg; then
            echo "description.ext and cover image already match this release; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add description.ext Pictures/loading.jpg
            git commit -m "ci: bump version to ${{ steps.get_version.outputs.VERSION }} and refresh cover image [skip ci]"
            git push origin HEAD:main
          fi
