name: SQFValidation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@master
    - name: Validate SQF
      run: python3 releaseVerificationAndDeployment/sqf_validator.py
    - name: Validate Config
      run: python3 releaseVerificationAndDeployment/config_style_checker.py
    - name: Validate interaction equipment UI
      run: python3 releaseVerificationAndDeployment/interaction_ui_checker.py
    - name: Validate all first-party drawn UI
      run: python3 releaseVerificationAndDeployment/drawn_ui_checker.py
    - name: Validate Zeus and script API parity
      run: python3 releaseVerificationAndDeployment/zeus_script_parity_checker.py
    - name: Test interaction equipment UI checker
      working-directory: releaseVerificationAndDeployment
      run: python3 -m unittest -v test_interaction_ui_checker.py
    - name: Test full-pack audit and release guardrails
      working-directory: releaseVerificationAndDeployment
      run: python3 -m unittest -v test_full_arma_audit.py
    - name: Check whitespace
      run: git diff --check HEAD
      
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@master
    - name: Lint (sqflint)
      uses: arma-actions/sqflint@master
      with:
        args: --exit e --directory MissionScripts
      continue-on-error: true # No failure due to many false-positives
